  childBirthYear:  2007,
  date:            "2026年6月21日",

  openingQuote: "爸，我不知道怎么跟你开口。但我还是想试一次。",

  keywords: ["伙食费", "已读不回", "不知道说什么", "但还是想说", "你是我爸"],

  letter: {
    p1: "我试着想我们之间有什么回忆，想了很久，最清晰的画面就是你每个星期给我生活费。别人可能觉得这算什么，但对我来说，那就是我们。每个星期你掏出钱来，有时候多说一句「够不够」，有时候什么都不说。我接过来，也什么都不说。我们之间的关系，好像就靠这个维持着。",
    p2: "初中的时候我们关系不好，你知道的。那时候我觉得你不理解我，你可能也觉得我不听话。高中慢慢好了一点，但也只是不吵了，不是真的近了。我们就这样不远不近地待着，谁都不知道该怎么再往前一步。其实有时候我挺想跟你聊点什么的，可是一拿起手机，打了几行字，又觉得——算了，说了他也不一定回。",
    p3: "前几天我给你发了一段挺长的消息，你没回我。我不知道你是忙还是不知道该怎么回。我没生气，但说实话，心里有一点点难过。后来我想，可能你也有你的不容易。你可能觉得自己很普通，没什么好说的。但我想告诉你，你每个星期给我的那些钱，我都记得。那不只是钱。那是你还在管我、还在意我的证据。",
    p4: "爸，我不太会说漂亮话，想说心里话也不知道该说什么。但这个网站是我自己做的，花了挺长时间。我没什么目的，就是想让你知道，有个人记得你做过的那些事。父亲节快乐。",
  },

  sendMessage: "爸，父亲节快乐。这个链接是我做给你的，你点开看看。——明森",

  photos: [],

  timeline: [
    { year: "2007", text: "我出生了。你成了聂汉宙的儿子的爸爸" },
    { year: "2013", text: "小学，每天的事我已经记不太清了。但你在" },
    { year: "2020", text: "初中，我们关系最差的几年。谁都不想先开口" },
    { year: "2023", text: "高中，慢慢不吵了。不是和好了，是都累了" },
    { year: "2026", text: "我 19 了。我给你发了一条长消息，你没回。但我又做了这个" },
  ],

  restorationBefore: "",
  restorationAfter:  "",

  audioUrl:   "",
  bgMusicUrl: "",
  voiceText:  "爸，父亲节快乐。我不太会说话，你知道的。但你每星期给我的那些钱，我都记得。那不只是钱。谢谢你。",

  product: null,
};
/* CONFIG-END */
</script>

<style>
/* ── 重置 & 基础 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* 墨色系 (英雄/结尾) */
  --ink:        #0C0701;
  --ink-m:      #1C0E04;
  --ink-l:      #2A1808;

  /* 金色系 */
  --gold:       #C8860A;
  --gold-w:     #E8A020;
  --gold-s:     #F2BE50;
  --gold-glow:  rgba(232, 160, 32, 0.22);

  /* 暖白系 (正文区) */
  --cream:      #FDFAF5;
  --cream2:     #FFF7EC;
  --paper:      #FEFCF8;

  /* 文字 */
  --t-dark:  #1A0E04;
  --t-mid:   #5C3A18;
  --t-soft:  #8A6038;
  --t-muted: #B09070;

  /* 阴影 */
  --sh-s: 0 2px 12px rgba(20,10,3,.07);
  --sh-m: 0 4px 28px rgba(20,10,3,.11);
  --sh-l: 0 10px 56px rgba(20,10,3,.16);

  --serif: "Noto Serif SC", "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
  --sans:  -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background: var(--ink);
  color: var(--t-dark);
  font-family: var(--sans);
  line-height: 1.85;
  overflow-x: hidden;
}

/* ── 加载屏 ── */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  transition: opacity .6s ease, visibility .6s ease;
}
#loader.out { opacity: 0; visibility: hidden; }
.loader-bloom {
  font-size: 40px;
  animation: loaderPulse 1.2s ease-in-out infinite;
}
@keyframes loaderPulse {
  0%,100% { transform: scale(1); opacity: 0.6; }
  50%      { transform: scale(1.3); opacity: 1; }
}

/* ── 花瓣 ── */
#petals { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
.petal  { position:absolute; top:-40px; opacity:0; animation:fallPetal linear infinite; user-select:none; }
@keyframes fallPetal {
  0%   { opacity:0;   transform:translateY(-40px) rotate(0deg) translateX(0); }
  8%   { opacity:.6; }
  92%  { opacity:.4; }
  100% { opacity:0;   transform:translateY(108vh) rotate(580deg) translateX(25px); }
}

/* ── 主容器 ── */
#app { position:relative; z-index:2; max-width:430px; margin:0 auto; }

/* ── 通用 section ── */
.sec {
  opacity: 0; transform: translateY(32px);
  transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1);
}
.sec.vis { opacity:1; transform:translateY(0); }

.sec-inner { padding: 60px 28px; }
.sec-light { background: var(--cream); }
.sec-warm  { background: var(--cream2); }
.sec-alt   { background: var(--paper); }
.sec-dark  { background: var(--ink); }

/* ── 通用标签 ── */
.eyebrow {
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: 5px;
  color: var(--gold);
  text-align: center;
  margin-bottom: 28px;
}
.eyebrow-light { color: rgba(232,160,32,.7); }
.sec-desc { font-size:13px; color:var(--t-muted); text-align:center; margin-top:-16px; margin-bottom:24px; }

/* ════════════════════════════════════
   ① HERO — 墨黑舞台，金字登场
════════════════════════════════════ */
#hero {
  min-height: 100svh;
  background: radial-gradient(ellipse at 50% 38%, var(--ink-l) 0%, var(--ink) 72%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 80px 32px 60px;
  position: relative;
  opacity: 1; transform: none; /* hero 不需要 scroll reveal */
}

.hero-eye {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 8px;
  color: rgba(232,160,32,.55);
  margin-bottom: 32px;
  animation: fadeUp .8s ease .3s both;
}

.hero-name {
  font-family: var(--serif);
  font-size: clamp(58px, 18vw, 88px);
  font-weight: 900;
  color: var(--gold-w);
  letter-spacing: 12px;
  line-height: 1;
  margin-bottom: 28px;
  text-shadow: 0 0 80px var(--gold-glow), 0 0 160px rgba(232,160,32,.08);
  min-height: 1.1em; /* 防止字符未渲染时跳动 */
}

/* 每个汉字独立动画 */
.hero-char {
  display: inline-block;
  opacity: 0;
  transform: translateY(36px) scale(.9);
  animation: charIn .9s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes charIn {
  to { opacity:1; transform:translateY(0) scale(1); }
}

.hero-sub {
  font-family: var(--serif);
  font-size: 16px;
  color: rgba(255,240,200,.45);
  letter-spacing: 3px;
  animation: fadeUp .8s ease 1.6s both;
}

.hero-date {
  font-family: var(--sans);
  font-size: 11px;
  color: rgba(232,160,32,.4);
  letter-spacing: 4px;
  margin-top: 36px;
  animation: fadeUp .8s ease 1.9s both;
}

.hero-scroll {
  position: absolute; bottom: 36px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  animation: fadeUp .8s ease 2.4s both;
}
.scroll-line {
  width: 1px; height: 40px;
  background: linear-gradient(180deg, transparent, rgba(232,160,32,.5));
  animation: scrollLine 2s ease-in-out infinite;
}
@keyframes scrollLine {
  0%,100% { transform:scaleY(0); transform-origin:top; }
  50%      { transform:scaleY(1); transform-origin:top; }
}
.scroll-txt {
  font-size: 10px; letter-spacing:3px;
  color: rgba(232,160,32,.35);
}

/* ════════════════════════════════════
   ② QUOTE — 一句话，全场静默
════════════════════════════════════ */
#quote-sec .sec-inner { padding: 72px 36px; }

.quote-wrap {
  display: flex; flex-direction: column; align-items: center;
}
.quote-bar {
  width: 2px; height: 40px;
  background: linear-gradient(180deg, transparent, var(--gold));
  margin-bottom: 24px; border-radius: 2px;
}
.quote-text {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 400;
  color: var(--t-dark);
  line-height: 1.85;
  text-align: center;
  position: relative;
}
.quote-text::before {
  content: '\201C';
  font-family: Georgia, serif;
  font-size: 80px;
  color: var(--gold-s);
  opacity: .18;
  position: absolute;
  top: -20px; left: -12px;
  line-height: 1;
}

/* ════════════════════════════════════
   ③ STATS — 数字承载时间的重量
════════════════════════════════════ */
#stats-sec .sec-inner { padding: 56px 28px; }

.stats-grid {
  display: flex; align-items: stretch;
  justify-content: center; gap: 0;
  margin-top: 4px;
}
.stat-block {
  flex: 1; max-width: 110px;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 8px;
}
.stat-num {
  font-family: var(--serif);
  font-size: 38px; font-weight: 900;
  color: var(--t-dark); line-height: 1;
  display: block;
}
.stat-label {
  font-size: 13px; color: var(--gold);
  font-weight: 600; margin-top: 2px;
  display: block;
}
.stat-desc {
  font-size: 11px; color: var(--t-muted);
  letter-spacing: 1px; margin-top: 6px;
}
.stat-divider {
  width: 1px; background: rgba(200,134,10,.18);
  margin: 12px 0; border-radius: 1px; align-self: stretch;
}

/* ════════════════════════════════════
   ④ KEYWORDS — 每个词，一幅画
════════════════════════════════════ */
#keywords-sec .sec-inner { padding: 56px 28px; }

.kw-poem {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.kw-line {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 18px;
}
.kw-line:last-child { margin-bottom: 0; }
.kw-he {
  font-family: var(--serif);
  font-size: 13px; color: var(--t-muted);
  letter-spacing: 2px;
}
.kw-word {
  font-family: var(--serif);
  font-size: 24px; font-weight: 700;
  color: var(--t-dark);
  position: relative;
  opacity: 0; transform: translateX(-16px);
  transition: opacity .5s ease, transform .5s ease;
}
.kw-word.vis { opacity:1; transform:translateX(0); }
.kw-word::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0; right: 0; height: 2px;
  background: var(--gold-s); opacity: .45;
  border-radius: 1px;
}

/* ════════════════════════════════════
   ⑤ LETTER — 一封信的质感
════════════════════════════════════ */
#letter-sec .sec-inner { padding: 56px 20px; }

.letter-card {
  background: var(--paper);
  border-radius: 18px;
  padding: 36px 26px 28px;
  box-shadow: var(--sh-l),
    inset 0 1px 0 rgba(255,255,255,.8);
  position: relative;
  overflow: hidden;
}

.letter-wm {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-family: var(--serif);
  font-size: 220px; font-weight: 900;
  color: rgba(200,134,10,.032);
  pointer-events: none; user-select: none;
  line-height: 1;
}

.letter-p {
  font-family: var(--serif);
  font-size: 15.5px; font-weight: 400;
  color: var(--t-dark);
  line-height: 2.1;
  text-indent: 2em;
  margin-bottom: 22px;
  position: relative; z-index: 1;
}
.letter-p:last-child { margin-bottom: 0; }

.letter-sig {
  margin-top: 28px; padding-top: 20px;
  border-top: 1px solid rgba(200,134,10,.15);
  text-align: right;
  position: relative; z-index: 1;
}
.sig-name {
  font-family: var(--serif);
  font-size: 19px; font-weight: 700;
  color: var(--t-dark); letter-spacing: 2px;
}
.sig-date {
  font-size: 12px; color: var(--t-muted);
  margin-top: 5px; letter-spacing: 1px;
}

/* ════════════════════════════════════
   ⑥ PHOTOS — 宝丽来，留住时光
════════════════════════════════════ */
#photos-sec { padding: 60px 0 20px; }
#photos-sec .eyebrow { padding: 0 28px; }

.polaroid-rail {
  display: flex; gap: 20px;
  overflow-x: auto; padding: 16px 28px 20px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory;
}
.polaroid-rail::-webkit-scrollbar { display:none; }

.polaroid {
  flex-shrink: 0; width: 200px;
  background: white;
  border-radius: 4px;
  padding: 10px 10px 28px;
  box-shadow: 0 8px 32px rgba(20,10,3,.14), 0 2px 6px rgba(20,10,3,.06);
  scroll-snap-align: center;
}
/* 拟物旋转感 */
.polaroid:nth-child(2n)   { transform: rotate(1.8deg); }
.polaroid:nth-child(3n)   { transform: rotate(-1.2deg); }
.polaroid:nth-child(4n)   { transform: rotate(2.4deg); }
.polaroid:nth-child(5n)   { transform: rotate(-0.8deg); }

.polaroid img {
  width: 100%; height: 180px;
  object-fit: cover; display: block;
  border-radius: 2px;
}
.polaroid-cap {
  font-family: var(--serif);
  font-size: 12px; color: var(--t-soft);
  text-align: center;
  margin-top: 10px;
  letter-spacing: 1px;
}

/* ════════════════════════════════════
   ⑦ TIMELINE — 一条线，一个人的故事
════════════════════════════════════ */
#timeline-sec .sec-inner { padding: 60px 28px; }

.tl-body {
  position: relative; padding-left: 32px; margin-top: 8px;
}
.tl-body::before {
  content: '';
  position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px;
  background: linear-gradient(180deg, var(--gold-s), var(--gold));
  border-radius: 2px;
}

.tl-item { position: relative; margin-bottom: 32px; }
.tl-item:last-child { margin-bottom: 0; }

.tl-dot {
  position: absolute; left: -30px; top: 5px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 4px rgba(200,134,10,.15), 0 0 12px rgba(200,134,10,.3);
}

.tl-year {
  font-family: var(--sans);
  font-size: 11px; color: var(--gold);
  letter-spacing: 3px; margin-bottom: 5px;
}
.tl-text {
  font-family: var(--serif);
  font-size: 16px; color: var(--t-dark); line-height: 1.75;
}

/* ════════════════════════════════════
   ⑧ RESTORATION — 可拖拽对比滑块
════════════════════════════════════ */
#restore-sec .sec-inner { padding: 60px 28px; }

.restore-container {
  position: relative;
  width: 100%; height: 320px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--sh-m);
  margin-top: 20px;
  touch-action: none;
  cursor: col-resize;
}

.rs-layer {
  position: absolute; inset: 0;
}
.rs-layer img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.rs-after {
  clip-path: inset(0 50% 0 0);
  transition: clip-path 0s;
}

.rs-handle {
  position: absolute;
  top: 0; bottom: 0;
  left: 50%;
  width: 44px;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 10;
  gap: 0;
}
.rs-line {
  flex: 1; width: 2px;
  background: rgba(255,255,255,.9);
  border-radius: 2px;
}
.rs-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: white;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
  flex-shrink: 0;
}
.rs-btn svg { width: 18px; height: 18px; }

.rs-tags {
  position: absolute; bottom: 14px;
  left: 0; right: 0;
  display: flex; justify-content: space-between;
  padding: 0 16px;
  pointer-events: none;
}
.rs-tag {
  font-family: var(--sans);
  font-size: 11px; letter-spacing: 3px;
  color: white;
  background: rgba(0,0,0,.38);
  padding: 4px 10px; border-radius: 20px;
  backdrop-filter: blur(4px);
}

/* ════════════════════════════════════
   ⑨ AUDIO — 亲口说的话
════════════════════════════════════ */
#audio-sec .sec-inner { padding: 60px 28px; }

.audio-card {
  background: linear-gradient(135deg, #FFF3E0, #FFECC0);
  border-radius: 20px; padding: 32px 24px;
  box-shadow: var(--sh-m);
  text-align: center;
}
.audio-hint { font-size:14px; color:var(--t-soft); margin-bottom:24px; font-family:var(--serif); }

.audio-wave {
  display: flex; align-items: center; justify-content: center;
  gap: 3px; height: 36px; margin-bottom: 24px;
}
.wave-bar {
  width: 3px; border-radius: 3px;
  background: var(--gold);
  animation: wavePulse 1.2s ease-in-out infinite;
}
@keyframes wavePulse {
  0%,100% { height: 8px; opacity:.4; }
  50%      { height: 28px; opacity:1; }
}

.audio-play {
  width: 68px; height: 68px; border-radius: 50%;
  background: var(--gold); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 4px 20px rgba(200,134,10,.45);
  transition: transform .15s;
}
.audio-play:active { transform: scale(.92); }
.audio-play svg { width: 26px; height: 26px; fill: white; margin-left: 3px; }

.audio-prog-wrap { height: 4px; background: rgba(200,134,10,.2); border-radius: 2px; overflow: hidden; }
.audio-prog-fill { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; transition: width .1s linear; }

.audio-voice-text {
  display: none;
  font-family: var(--serif); font-size: 15px; line-height: 1.9;
  color: var(--t-mid); text-align: left;
  margin-top: 22px; padding: 18px 20px;
  background: rgba(255,255,255,.5);
  border: 1px solid rgba(200,134,10,.18);
  border-radius: 12px;
}
.audio-voice-text.show { display: block; }

.audio-music-tag {
  display: none; align-items: center; justify-content: center; gap: 6px;
  font-size: 11px; color: var(--t-soft); letter-spacing: 1px;
  margin-top: 18px; opacity: .65;
}
.audio-music-tag.show { display: flex; }
.audio-music-tag .note {
  font-size: 13px; display: inline-block;
  animation: notePulse 1.4s ease-in-out infinite;
  animation-play-state: paused;
}
.audio-music-tag.on .note { animation-play-state: running; }
@keyframes notePulse {
  0%,100% { opacity:.4; transform: scale(1) translateY(0); }
  50%      { opacity:1; transform: scale(1.2) translateY(-2px); }
}

/* ════════════════════════════════════
   ⑩ PRODUCT — 一杯酒，说尽千言
════════════════════════════════════ */
#product-sec {
  background: radial-gradient(ellipse at 50% 0%, var(--ink-l) 0%, var(--ink) 60%);
}
#product-sec .sec-inner { padding: 72px 28px 64px; }

.product-tagline {
  font-family: var(--serif);
  font-size: 19px; line-height: 1.95;
  color: rgba(255,240,200,.85);
  text-align: center;
  margin-bottom: 36px;
}

.product-frame {
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  margin-bottom: 28px;
  box-shadow: 0 20px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(232,160,32,.12);
}
.product-frame img { width:100%; display:block; }
.product-badge {
  position: absolute; top: 16px; left: 16px;
  font-family: var(--sans); font-size: 10px; letter-spacing: 3px;
  color: var(--ink); background: var(--gold-s);
  padding: 6px 12px; border-radius: 20px; font-weight: 700;
}

.product-name {
  font-family: var(--serif);
  font-size: 26px; font-weight: 900;
  color: var(--gold-w); text-align: center;
  letter-spacing: 6px; margin-bottom: 6px;
}
.product-brand {
  font-size: 11px; letter-spacing: 4px;
  color: rgba(232,160,32,.45);
  text-align: center; margin-bottom: 28px;
}

.product-features { margin-bottom: 32px; }
.product-feature {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 14px; color: rgba(255,240,200,.7);
  line-height: 1.7; margin-bottom: 12px;
}
.product-feature:last-child { margin-bottom: 0; }
.product-feature::before {
  content: '✓'; color: var(--gold); font-weight: 700;
  flex-shrink: 0; margin-top: 1px;
}

.product-countdown {
  display: flex; justify-content: center; align-items: flex-start; gap: 10px;
  margin-bottom: 28px;
}
.cd-block { text-align: center; }
.cd-num {
  font-family: var(--serif); font-size: 24px; font-weight: 900;
  color: var(--gold-w); background: rgba(232,160,32,.08);
  border: 1px solid rgba(232,160,32,.18);
  border-radius: 8px; padding: 8px 4px; min-width: 46px; display: block;
}
.cd-label { font-size: 10px; color: rgba(232,160,32,.4); letter-spacing: 2px; margin-top: 6px; }
.cd-colon { font-family: var(--serif); font-size: 24px; color: rgba(232,160,32,.3); padding-top: 6px; }

.product-price-row {
  display: flex; align-items: baseline; justify-content: center;
  gap: 10px; margin-bottom: 24px;
}
.product-price {
  font-size: 14px; color: rgba(232,160,32,.55); letter-spacing: 1px;
}
.product-price-original {
  font-size: 12px; color: rgba(255,240,200,.25);
  text-decoration: line-through;
}

.product-cta {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, var(--gold-s), var(--gold-w));
  color: var(--ink); border: none; border-radius: 50px;
  font-size: 17px; font-family: var(--sans); font-weight: 700; letter-spacing: 2px;
  cursor: pointer; text-decoration: none;
  box-shadow: 0 8px 30px rgba(232,160,32,.35);
  transition: transform .15s, box-shadow .15s;
}
.product-cta:active { transform: scale(.97); }

.product-stock {
  text-align: center; font-size: 11px;
  color: rgba(232,160,32,.4); letter-spacing: 2px;
  margin-top: 16px;
}

/* ════════════════════════════════════
   ⑪ SEND — 发给爸爸
════════════════════════════════════ */
#send-sec .sec-inner { padding: 70px 28px 60px; text-align: center; }

/* 微信气泡样式 */
.wechat-mockup {
  background: #EDEDED;
  border-radius: 16px;
  padding: 20px 18px;
  margin-bottom: 32px;
  text-align: left;
}
.wechat-row {
  display: flex; align-items: flex-start; gap: 10px;
}
.wechat-avatar {
  width: 38px; height: 38px; border-radius: 8px;
  background: linear-gradient(135deg, #6CA9D4, #4A80B0);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.wechat-bubble {
  background: white;
  border-radius: 0 10px 10px 10px;
  padding: 12px 14px;
  font-size: 15px; color: #111;
  line-height: 1.7; flex: 1;
  font-family: var(--sans);
  position: relative;
}
.wechat-bubble::before {
  content: '';
  position: absolute; top: 10px; left: -6px;
  width: 0; height: 0;
  border: 6px solid transparent;
  border-right-color: white;
  border-left: 0;
}
.wechat-name {
  font-size: 11px; color: #888; margin-bottom: 4px;
}

.send-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 16px 40px;
  background: var(--gold-w); color: white;
  border: none; border-radius: 50px;
  font-size: 17px; font-family: var(--sans);
  font-weight: 600; letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(200,134,10,.4);
  transition: transform .15s, box-shadow .15s;
}
.send-btn:active { transform: scale(.96); box-shadow: 0 2px 10px rgba(200,134,10,.4); }
.send-btn.ok    { background: #27AE60; box-shadow: 0 4px 20px rgba(39,174,96,.4); }
.send-hint-txt  { font-size: 12px; color: rgba(255,240,200,.35); margin-top: 16px; letter-spacing: 2px; }

/* ════════════════════════════════════
   ⑫ CLOSING — 与英雄遥遥呼应
════════════════════════════════════ */
#closing-sec { background: radial-gradient(ellipse at 50% 60%, var(--ink-l) 0%, var(--ink) 70%); }
#closing-sec .sec-inner {
  padding: 80px 32px 90px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}

.closing-petal { font-size: 36px; margin-bottom: 24px; animation: floatPetal 4s ease-in-out infinite; }
@keyframes floatPetal { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-10px) rotate(10deg)} }

.closing-to {
  font-family: var(--serif);
  font-size: 28px; font-weight: 700;
  color: var(--gold-w); letter-spacing: 6px;
  margin-bottom: 16px;
}
.closing-msg {
  font-family: var(--serif);
  font-size: 15px; color: rgba(255,240,200,.5);
  letter-spacing: 2px; margin-bottom: 40px;
}
.closing-divider {
  width: 40px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin-bottom: 24px;
}
.closing-from {
  font-size: 13px; color: rgba(232,160,32,.55);
  letter-spacing: 3px; margin-bottom: 6px;
}
.closing-date {
  font-size: 11px; color: rgba(232,160,32,.3);
  letter-spacing: 3px;
}

/* ── 通用动效 ── */
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

/* ── premium-only 默认隐藏 ── */
.premium-only { display: none; }
</style>
</head>
<body>

<!-- 加载屏 -->
<div id="loader"><div class="loader-bloom">🌸</div></div>

<!-- 花瓣 -->
<div id="petals"></div>

<!-- 主体 -->
<div id="app">

  <!-- ① HERO -->
  <section id="hero">
    <p class="hero-eye">父 亲 节 礼 物</p>
    <h1 class="hero-name" id="heroName" aria-label="父亲名字"></h1>
    <p class="hero-sub">这份礼物，专属于你</p>
    <p class="hero-date" id="heroDate"></p>
    <div class="hero-scroll">
      <div class="scroll-line"></div>
      <p class="scroll-txt">向 下 翻 阅</p>
    </div>
  </section>

  <!-- ② QUOTE -->
  <section id="quote-sec" class="sec sec-light">
    <div class="sec-inner">
      <div class="quote-wrap">
        <div class="quote-bar"></div>
        <p class="quote-text" id="quoteText"></p>
      </div>
    </div>
  </section>

  <!-- ③ STATS -->
  <section id="stats-sec" class="sec sec-alt">
    <div class="sec-inner">
      <p class="eyebrow">我 们 的 时 光</p>
      <div class="stats-grid">
        <div class="stat-block">
          <span class="stat-num" id="yearsNum">0</span>
          <span class="stat-label">年</span>
          <p class="stat-desc">相伴岁月</p>

        <div class="stat-divider"></div>
        <div class="stat-block">
          <span class="stat-num" id="daysNum">0</span>
          <span class="stat-label">天</span>
          <p class="stat-desc">共同走过</p>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-block">

          <span class="stat-label"></span>

      </div>

  <!-- ④ KEYWORDS -->
  <section id="keywords-sec" class="sec sec-light">
    <div class="sec-inner">

  <!-- ⑥ PHOTOS（premium）-->

  <!-- ⑦ TIMELINE（premium）-->
  <section id="timeline-sec" class="sec sec-alt premium-only">
    <div class="sec-inner">
      <p class="eyebrow">时 光 轴</p>

  <!-- ⑧ RESTORATION（premium）-->
  <section id="restore-sec" class="sec sec-light premium-only">
    <div class="sec-inner">
      <p class="eyebrow">时 光 修 复</p>
      <p class="sec-desc">把老照片还原成最初的样子 · 左右拖动对比</p>
      <div class="restore-container" id="restoreContainer">
        <div class="rs-layer rs-before"><img id="rsBefore" src="" alt="修复前" loading="lazy"></div>
        <div class="rs-layer rs-after"  id="rsAfter"><img id="rsAfterImg" src="" alt="修复后" loading="lazy"></div>
        <div class="rs-handle" id="rsHandle">

          <div class="rs-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="#C8860A" stroke-width="2.5">
              <polyline points="9,6 3,12 9,18"/><polyline points="15,6 21,12 15,18"/>
            </svg>
          </div>
          <div class="rs-line"></div>

        <div class="rs-tags">

  <!-- ⑨ AUDIO（premium，点击同时播放录音与轻音乐）-->
  <section id="audio-sec" class="sec sec-warm premium-only">
    <div class="sec-inner">
      <p class="eyebrow">亲 口 说 的 话</p>
      <div class="audio-card">
        <p class="audio-hint" id="audioHint">点击播放，听我想对你说的话</p>
        <div class="audio-wave" id="audioWave"></div>
        <button class="audio-play" id="playBtn" onclick="togglePlayback()">
          <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>
        </button>
        <div class="audio-prog-wrap"><div class="audio-prog-fill" id="progFill"></div></div>
        <p class="audio-music-tag show" id="musicTag"><span class="note">♪</span><span>轻音乐同步响起</span></p>
        <p class="audio-voice-text" id="voiceTextEl"></p>
      </div>
    </div>
  </section>

  <!-- ⑩ PRODUCT（premium）-->
  <section id="product-sec" class="sec sec-dark premium-only">
    <div class="sec-inner">
      <p class="eyebrow eyebrow-light">献 给 父 亲 的 礼 物</p>
      <p class="product-tagline" id="productTagline"></p>
      <div class="product-frame">
        <span class="product-badge" id="productBadge"></span>
        <img id="productImg" src="" alt="父亲节礼物" loading="lazy">
      </div>
      <p class="product-name" id="productName"></p>
      <p class="product-brand" id="productBrand"></p>
      <div class="product-features" id="productFeatures"></div>
      <div class="product-countdown" id="productCountdown"></div>
      <div class="product-price-row">
        <span class="product-price-original" id="productOriginalPrice"></span>
        <span class="product-price" id="productPrice"></span>

      <a class="product-cta" id="productCta" href="#" target="_blank" rel="noopener">
        <span id="productCtaText">为爸爸订一瓶</span>

  <!-- ⑪ SEND -->

        <div class="wechat-row">
          <div class="wechat-avatar">👨</div>
          <div>
            <p class="wechat-name" id="wechatName">爸爸</p>

          </div>

      <button class="send-btn" id="sendBtn" onclick="copyMsg()">
        <span>📋</span><span id="sendLabel">复制这句话</span>

  <!-- ⑫ CLOSING -->

      <div class="closing-petal">🌸</div>

      <p class="closing-msg">你永远是我最重要的人</p>

      <p class="closing-date" id="closingDate"></p>
    </div>
  </section>

</div><!-- /#app -->

<audio id="bgAudio" loop></audio>
<audio id="voiceAudio"></audio>

<script>
/* ─────────── 初始化 ─────────── */
(function boot() {
  const C = CONFIG;
  const now = new Date().getFullYear();

  /* 页面标题 */
  document.title = C.fatherName + '，父亲节快乐';

  /* Hero 逐字显现 */
  revealName(C.fatherName, document.getElementById('heroName'));

  /* 基础文字 */
  document.getElementById('heroDate').textContent    = C.date + ' · 父亲节';
  document.getElementById('quoteText').textContent   = C.openingQuote;
  document.getElementById('wechatBubble').textContent = C.sendMessage;
  document.getElementById('wechatName').textContent  = C.fatherName;
  document.getElementById('sigName').textContent     = C.childName + ' 敬上';
  document.getElementById('sigDate').textContent     = C.date;
  document.getElementById('closingTo').textContent   = C.fatherName + '，节日快乐';
  document.getElementById('closingFrom').textContent = '来自：' + C.childName;
  document.getElementById('closingDate').textContent = C.date;

  /* 关键词诗歌排列 */
  const poem = document.getElementById('kwPoem');
  C.keywords.forEach((w, i) => {
    const line = document.createElement('div');
    line.className = 'kw-line';
    line.innerHTML = `<span class="kw-he">他</span><span class="kw-word" style="transition-delay:${i*.12}s">${w}</span>`;
    poem.appendChild(line);
  });

  /* 信件 */
  const lc = document.getElementById('letterContent');
  ['p1','p2','p3','p4'].forEach(k => {
    if (!C.letter[k]) return;
    const p = document.createElement('p'); p.className = 'letter-p';
    p.textContent = C.letter[k]; lc.appendChild(p);
  });

  /* 数字统计（初始值，等 IntersectionObserver 触发再滚动） */
  const years = now - C.childBirthYear;
  const days  = Math.round(years * 365.25);
  const statsEl = document.getElementById('stats-sec');
  statsEl._years = years; statsEl._days = days;

  /* premium 内容 */
  if (C.plan === 'premium') {
    document.querySelectorAll('.premium-only').forEach(el => el.classList.remove('premium-only'));

    /* 照片 */
    if ((C.photos || []).length) {
      const rail = document.getElementById('polaroidRail');
      C.photos.forEach(item => {
        const div = document.createElement('div'); div.className = 'polaroid';
        const img = document.createElement('img'); img.loading = 'lazy';
        img.alt = '家庭照片'; setImg(img, item.url || item, '家庭照片');
        div.appendChild(img);
        if (item.caption) {
          const cap = document.createElement('p'); cap.className = 'polaroid-cap';
          cap.textContent = item.caption; div.appendChild(cap);
        }
        rail.appendChild(div);
      });
    } else {
      document.getElementById('photos-sec').style.display = 'none';
    }

    /* 时间轴 */
    if ((C.timeline || []).length) {
      const tl = document.getElementById('tlBody');
      C.timeline.forEach(item => {
        const d = document.createElement('div'); d.className = 'tl-item';
        d.innerHTML = `<div class="tl-dot"></div><p class="tl-year">${item.year}</p><p class="tl-text">${item.text}</p>`;
        tl.appendChild(d);
      });
    } else {
      document.getElementById('timeline-sec').style.display = 'none';
    }

    /* 修复对比 */
    if (C.restorationBefore && C.restorationAfter) {
      setImg(document.getElementById('rsBefore'),   C.restorationBefore, '修复前照片');
      setImg(document.getElementById('rsAfterImg'), C.restorationAfter,  '修复后照片');
      initRestoreSlider();
    } else {
      document.getElementById('restore-sec').style.display = 'none';
    }

    /* 录音 + 背景音乐：点击按钮一键响起
       有真实录音就播录音，没有就用语音朗读 voiceText；
       有真实背景音乐就播放音乐文件，没有就生成一段轻音乐伴奏 */
    if (C.audioUrl) {
      document.getElementById('voiceAudio').src = C.audioUrl;
      document.getElementById('audioHint').textContent = '点击播放，听我亲口说给你听';
    } else {
      document.getElementById('audioHint').textContent = '点击播放，听听我想对你说的话';
      const vt = document.getElementById('voiceTextEl');
      vt.textContent = C.voiceText;
      vt.classList.add('show');
    }
    if (C.bgMusicUrl) {
      document.getElementById('bgAudio').src = C.bgMusicUrl;
    }
    buildWaveform();

    /* 产品区 */
    if (C.product) initProduct(C.product);
    else document.getElementById('product-sec').style.display = 'none';
  }

  spawnPetals();
  observeSections();

  /* 加载屏淡出 */
  setTimeout(() => {
    document.getElementById('loader').classList.add('out');
  }, 900);
})();

/* ─────────── 图片安全加载（链接失效时显示占位图，不留白）─────────── */
function setImg(el, src, label) {
  if (!el) return;
  const fallback = 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480">` +
    `<rect width="100%" height="100%" fill="#FFF3E0"/>` +
    `<text x="50%" y="50%" font-family="sans-serif" font-size="22" fill="#C8860A" text-anchor="middle" dy=".35em">${label || '请替换图片'}</text>` +
    `</svg>`
  );
  el.onerror = () => { el.onerror = null; el.src = fallback; };
  el.src = src || fallback;
}

/* ─────────── Hero 逐字显现 ─────────── */
function revealName(name, el) {
  [...name].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'hero-char';
    s.textContent = ch;
    s.style.animationDelay = (0.9 + i * 0.18) + 's';
    el.appendChild(s);
  });
}

/* ─────────── 花瓣 ─────────── */
function spawnPetals() {
  const icons = ['🌸','🌺','🌼','✿','❀'];
  const c = document.getElementById('petals');
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('span'); p.className = 'petal';
    p.textContent = icons[i % icons.length];
    p.style.left  = Math.random() * 100 + 'vw';
    p.style.fontSize = (12 + Math.random() * 14) + 'px';
    p.style.animationDuration = (7 + Math.random() * 9) + 's';
    p.style.animationDelay   = (Math.random() * 14) + 's';
    c.appendChild(p);
  }
}

/* ─────────── 滚动观察 ─────────── */
function observeSections() {
  let statsTriggered = false;

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target;

      el.classList.add('vis');

      /* 关键词逐一出现 */
      el.querySelectorAll('.kw-word').forEach(w => w.classList.add('vis'));

      /* 数字统计滚动触发 */
      if (el.id === 'stats-sec' && !statsTriggered) {
        statsTriggered = true;
        countUp('yearsNum', el._years || 24, 1400);
        countUp('daysNum',  el._days  || 8766, 2000);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.sec').forEach(el => io.observe(el));
}

/* ─────────── 数字滚动 ─────────── */
function countUp(id, target, dur) {
  const el = document.getElementById(id);
  const t0 = performance.now();
  function tick(now) {
    const p = Math.min((now - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3); // cubic ease out
    el.textContent = Math.floor(ease * target);
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = target;
  }
  requestAnimationFrame(tick);
}

/* ─────────── 修复对比滑块 ─────────── */
function initRestoreSlider() {
  const container = document.getElementById('restoreContainer');
  const after     = document.getElementById('rsAfter');
  const handle    = document.getElementById('rsHandle');
  let dragging = false;

  function setPos(x) {
    const rect = container.getBoundingClientRect();
    let pct = (x - rect.left) / rect.width;
    pct = Math.max(0.05, Math.min(0.95, pct));
    const p = (pct * 100).toFixed(1);
    after.style.clipPath = `inset(0 ${(100 - pct * 100).toFixed(1)}% 0 0)`;
    handle.style.left = p + '%';
  }

  /* mouse */
  handle.addEventListener('mousedown', e => { dragging = true; e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (dragging) setPos(e.clientX); });
  window.addEventListener('mouseup',   () => { dragging = false; });

  /* touch */
  handle.addEventListener('touchstart', e => { dragging = true; e.preventDefault(); }, { passive:false });
  window.addEventListener('touchmove',  e => { if (dragging) setPos(e.touches[0].clientX); }, { passive:true });
  window.addEventListener('touchend',   () => { dragging = false; });

  /* 自动演示：进入视口时先滑动一次 */
  const demoIo = new IntersectionObserver(([entry]) => {
    if (!entry.isIntersecting) return;
    demoIo.disconnect();
    let pct = 50, dir = -1;
    const demo = setInterval(() => {
      pct += dir * 0.6;
      if (pct <= 20) dir = 1;
      if (pct >= 50) { clearInterval(demo); return; }
      const af = document.getElementById('rsAfter');
      const hd = document.getElementById('rsHandle');
      if (af) af.style.clipPath = `inset(0 ${(100 - pct).toFixed(1)}% 0 0)`;
      if (hd) hd.style.left = pct + '%';
    }, 16);
  }, { threshold: 0.5 });
  demoIo.observe(container);
}

/* ─────────── 录音波形 ─────────── */
function buildWaveform() {
  const wrap = document.getElementById('audioWave');
  if (!wrap) return;
  const bars = [4,8,14,20,26,22,16,10,7,12,18,24,20,14,9,6,11,17,23,18,13,8];
  bars.forEach((h, i) => {
    const b = document.createElement('div'); b.className = 'wave-bar';
    b.style.height = h + 'px';
    b.style.animationDelay = (i * 0.06) + 's';
    wrap.appendChild(b);
  });
}

/* ─────────── 产品区（一杯酒） ─────────── */
function initProduct(p) {
  document.getElementById('productTagline').textContent = p.tagline || '';
  setImg(document.getElementById('productImg'), p.image, '产品展示图');
  document.getElementById('productBadge').textContent = p.badge || '父亲节限定';
  document.getElementById('productName').textContent  = p.name || '';
  document.getElementById('productBrand').textContent = p.brand || '';

  const fl = document.getElementById('productFeatures');
  (p.features || []).forEach(f => {
    const d = document.createElement('div'); d.className = 'product-feature';
    d.textContent = f; fl.appendChild(d);
  });

  document.getElementById('productPrice').textContent = '¥' + p.price;
  if (p.originalPrice) {
    document.getElementById('productOriginalPrice').textContent = '¥' + p.originalPrice;
  }

  const cta = document.getElementById('productCta');
  cta.href = p.ctaUrl || '#';
  document.getElementById('productCtaText').textContent = p.ctaText || '为爸爸订一瓶';

  if (p.stock != null) {
    document.getElementById('productStock').textContent = `仅剩 ${p.stock} 份 · 父亲节前发货`;
  }

  if (p.deadline) startCountdown(p.deadline);
}

function startCountdown(deadline) {
  const target = new Date(deadline).getTime();
  const wrap = document.getElementById('productCountdown');
  const units = [
    { key: 'd', label: '天' },
    { key: 'h', label: '时' },
    { key: 'm', label: '分' },
    { key: 's', label: '秒' },
  ];
  units.forEach((u, i) => {
    if (i > 0) {
      const colon = document.createElement('span');
      colon.className = 'cd-colon'; colon.textContent = ':';
      wrap.appendChild(colon);
    }
    const block = document.createElement('div'); block.className = 'cd-block';
    block.innerHTML = `<span class="cd-num" id="cd-${u.key}">00</span><span class="cd-label">${u.label}</span>`;
    wrap.appendChild(block);
  });

  function tick() {
    const diff = Math.max(0, target - Date.now());
    document.getElementById('cd-d').textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
    document.getElementById('cd-h').textContent = String(Math.floor(diff % 86400000 / 3600000)).padStart(2, '0');
    document.getElementById('cd-m').textContent = String(Math.floor(diff % 3600000 / 60000)).padStart(2, '0');
    document.getElementById('cd-s').textContent = String(Math.floor(diff % 60000 / 1000)).padStart(2, '0');
    if (diff <= 0) clearInterval(timer);
  }
  tick();
  const timer = setInterval(tick, 1000);
}

/* ─────────── 录音 / 语音留言 + 轻音乐：一键同时响起 ─────────── */
const PLAY_ICON  = '<polygon points="6,4 20,12 6,20"/>';
const PAUSE_ICON = '<rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/>';
const DUCK_VOLUME = 0.22;
const PAD_VOLUME  = 0.07;

const voiceEl = document.getElementById('voiceAudio');
const bgEl    = document.getElementById('bgAudio');
let voicePlaying = false;
let speaking     = false;

voiceEl.ontimeupdate = () => {
  if (!voiceEl.duration) return;
  const fill = document.getElementById('progFill');
  if (fill) fill.style.width = (voiceEl.currentTime / voiceEl.duration * 100) + '%';
};
voiceEl.onended = () => endPlayback();

/* 音量渐变（音频 ducking） */
function fadeAudio(el, from, to, duration, onDone) {
  const start = performance.now();
  el.volume = from;
  (function step(now) {
    const p = Math.min((now - start) / duration, 1);
    el.volume = from + (to - from) * p;
    if (p < 1) requestAnimationFrame(step);
    else if (onDone) onDone();
  })(start);
}

/* 没有提供背景音乐文件时，用 Web Audio 生成一段柔和的伴奏 */
let padCtx, padGain, padStarted = false;
function ensurePad() {
  if (padStarted) return;
  padStarted = true;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  padCtx = new Ctx();
  padGain = padCtx.createGain();
  padGain.gain.value = 0;
  padGain.connect(padCtx.destination);
  [130.81, 164.81, 196.00, 261.63].forEach(freq => {
    const osc = padCtx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = freq;
    const g = padCtx.createGain(); g.gain.value = 0.25;
    osc.connect(g); g.connect(padGain); osc.start();
  });
  const lfo = padCtx.createOscillator();
  lfo.frequency.value = 0.1;
  const lfoGain = padCtx.createGain(); lfoGain.gain.value = 0.02;
  lfo.connect(lfoGain); lfoGain.connect(padGain.gain); lfo.start();
}
function padFadeTo(target, duration) {
  ensurePad();
  if (!padCtx) return;
  if (padCtx.state === 'suspended') padCtx.resume();
  const now = padCtx.currentTime;
  padGain.gain.cancelScheduledValues(now);
  padGain.gain.setValueAtTime(padGain.gain.value, now);
  padGain.gain.linearRampToValueAtTime(target, now + duration / 1000);
}

/* 没有真实录音时，用语音朗读 voiceText */
function speakVoice(text, onend) {
  if (!('speechSynthesis' in window)) { onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.02;
  const voice = speechSynthesis.getVoices().find(v => /zh/i.test(v.lang));
  if (voice) u.voice = voice;
  u.onend = onend; u.onerror = onend;
  speechSynthesis.speak(u);

  const fill = document.getElementById('progFill');
  const estMs = Math.max(2000, text.length * 260);
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(() => {
    fill.style.transition = `width ${estMs}ms linear`;
    fill.style.width = '100%';
  });
}

function startMusic() {
  if (CONFIG.bgMusicUrl) {
    bgEl.volume = 0; bgEl.currentTime = 0;
    bgEl.play().then(() => fadeAudio(bgEl, 0, DUCK_VOLUME, 800)).catch(() => {});
  } else {
    padFadeTo(PAD_VOLUME, 800);
  }
}
function stopMusic() {
  if (CONFIG.bgMusicUrl) {
    fadeAudio(bgEl, bgEl.volume, 0, 1200, () => bgEl.pause());
  } else {
    padFadeTo(0, 1200);
  }
}

function endPlayback() {
  voicePlaying = false; speaking = false;
  const icon = document.getElementById('playIcon');
  if (icon) icon.innerHTML = PLAY_ICON;
  const fill = document.getElementById('progFill');
  if (fill) { fill.style.transition = 'none'; fill.style.width = '0%'; }
  document.querySelectorAll('.wave-bar').forEach(b => b.style.animationPlayState = 'paused');
  document.getElementById('musicTag').classList.remove('on');
  stopMusic();
}

/* 点击播放：录音/语音留言 与 轻音乐 同时响起 */
function togglePlayback() {
  if (voicePlaying || speaking) {
    if (voicePlaying) voiceEl.pause();
    if (speaking) speechSynthesis.cancel();
    endPlayback();
    return;
  }
  document.getElementById('playIcon').innerHTML = PAUSE_ICON;
  document.querySelectorAll('.wave-bar').forEach(b => b.style.animationPlayState = 'running');
  document.getElementById('musicTag').classList.add('on');
  startMusic();

  if (CONFIG.audioUrl) {
    voiceEl.play(); voicePlaying = true;
  } else {
    speaking = true;
    speakVoice(CONFIG.voiceText, endPlayback);
  }
}

/* ─────────── 复制 ─────────── */
function copyMsg() {
  const text = CONFIG.sendMessage;
  const btn  = document.getElementById('sendBtn');
  const lbl  = document.getElementById('sendLabel');
  const done = () => {
    btn.classList.add('ok'); lbl.textContent = '已复制 ✓';
    setTimeout(() => { btn.classList.remove('ok'); lbl.textContent = '复制这句话'; }, 2800);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(fb);
  } else { fb(); }
  function fb() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done();
  }
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>爸，父亲节快乐</title>

<script>
/* ================================================================
   CONFIG — 只改这里，页面自动更新
   plan: "basic"   → 9.9 纯文字版
   plan: "premium" → 19.9 完整版（照片/时间轴/录音/修复对比）
================================================================ */
const CONFIG = {
  plan: "premium",

  /* ─── 必填 ─── */
  fatherName:   "爸爸",
  childName:    "小明",
  fatherBirthYear: 1968,      // 用于计算"相伴X年"
  childBirthYear:  2002,      // 孩子出生年
  date:         "2026年6月21日",
  openingQuote: "有些话，我一直藏在心里很多年，今天想说出来。",
  keywords:     ["沉默", "责任", "撑家", "不善言辞", "山一样"],

  letter: {
    p1: "小时候我总觉得你是个严肃的人。你很少开口，但家里的每一件事你都记着——电费涨了你知道，我成绩单来了你知道，我鞋子小了你也知道。只是那时我太小，读不懂沉默里藏着多少话。",
    p2: "后来我离开家去读书，才慢慢明白，你给我的那些东西没有一件是买得到的。是你骑着车送我上学的那条路，是你半夜起来给我盖被子的那只手，是你从来不说「我爱你」，却把所有好的都留给我的那种方式。",
    p3: "我知道我不是一个经常说谢谢的孩子。有时候我甚至不接你的电话，还嫌你唠叨。但我想让你知道，你做的每一件事，我都记得，一件都没忘。以后我会更常联系你，也会努力成为让你骄傲的人。",
    p4: "今年父亲节，我没有办法陪在你身边，但我希望你能感受到这几个字：爸，你辛苦了，谢谢你，我很爱你。往后的日子，请你多爱惜自己。",
  },

  sendMessage: "爸，父亲节快乐。这些年辛苦了，谢谢你。我爱你。",

  /* ─── premium 专属 ─── */
  photos: [
    { url: "https://picsum.photos/seed/fam1/480/360", caption: "那年夏天" },
    { url: "https://picsum.photos/seed/fam2/480/360", caption: "我们家" },
    { url: "https://picsum.photos/seed/fam3/480/360", caption: "最喜欢这张" },
    { url: "https://picsum.photos/seed/fam4/480/360", caption: "在一起" },
  ],

  timeline: [
    { year: "2002", text: "我来到这个世界，你第一次当爸爸" },
    { year: "2009", text: "你每天骑车送我上小学，从没迟到过" },
    { year: "2015", text: "我考上初中，你悄悄红了眼眶" },
    { year: "2020", text: "我第一次离家，你塞给我一个红包没说话" },
    { year: "2026", text: "今天，我想好好谢谢你" },
  ],

  restorationBefore: "https://picsum.photos/seed/old1bw/400/500",
  restorationAfter:  "https://picsum.photos/seed/new1/400/500",

  audioUrl:   "",   // 录音文件 URL 或 base64
  bgMusicUrl: "",   // 背景音乐 URL
};
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream:      #FFF8F0;
  --gold:       #C8860A;
  --gold-l:     #F0B429;
  --amber:      #E8960A;
  --brown:      #4A2C0A;
  --brown-m:    #7A4A1E;
  --text:       #3D2B1F;
  --muted:      #8B6B4A;
  --shadow:     rgba(92,58,30,0.12);
  --radius:     16px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--text);
  font-family: -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
  line-height: 1.85;
  overflow-x: hidden;
}

/* ── 花瓣 ── */
#petals { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.petal  { position:absolute; top:-40px; opacity:0; animation:fallPetal linear infinite; user-select:none; }
@keyframes fallPetal {
  0%   { opacity:0;   transform:translateY(-40px) rotate(0deg); }
  10%  { opacity:0.65; }
  90%  { opacity:0.4; }
  100% { opacity:0;   transform:translateY(108vh) rotate(560deg) translateX(30px); }
}

/* ── 容器 ── */
#app { position:relative; z-index:1; max-width:430px; margin:0 auto; }

/* ── 封面 ── */
#cover {
  min-height: 100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:70px 32px 64px; position:relative;
  background:linear-gradient(175deg,#FFF8F0 0%,#FFE8B8 100%);
}
.cv-badge  { font-size:11px; letter-spacing:7px; color:var(--gold); margin-bottom:24px; opacity:0; animation:fadeUp 1s ease 0.4s forwards; }
.cv-name   { font-size:clamp(54px,17vw,76px); font-weight:800; color:var(--brown); letter-spacing:8px; line-height:1; opacity:0; animation:fadeUp 1s ease 0.7s forwards; }
.cv-sub    { font-size:17px; color:var(--brown-m); margin-top:18px; opacity:0; animation:fadeUp 1s ease 1s forwards; }
.cv-flower { font-size:42px; margin:26px 0; opacity:0; animation:fadeUp 1s ease 1.2s forwards, floatF 4s ease-in-out 2.2s infinite; }
.cv-date   { font-size:12px; color:var(--gold); letter-spacing:4px; opacity:0; animation:fadeUp 1s ease 1.4s forwards; }
.cv-arrow  { position:absolute; bottom:32px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--muted); font-size:11px; letter-spacing:2px; opacity:0; animation:fadeUp 1s ease 2.2s forwards; }
.arrow-v   { width:18px; height:18px; border-right:2px solid var(--gold); border-bottom:2px solid var(--gold); transform:rotate(45deg); animation:aBounce 1.5s ease infinite; }
@keyframes aBounce   { 0%,100%{transform:rotate(45deg) translateY(0)} 50%{transform:rotate(45deg) translateY(5px)} }
@keyframes floatF    { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-10px) rotate(8deg)} }

/* ── 通用 section ── */
.section {
  padding:56px 28px;
  opacity:0; transform:translateY(28px);
  transition:opacity .75s ease, transform .75s ease;
}
.section.vis { opacity:1; transform:translateY(0); }
.sec-label   { font-size:11px; letter-spacing:5px; color:var(--gold); text-align:center; margin-bottom:24px; }

/* ── 引言 ── */
#quote {
  text-align:center;
  background:linear-gradient(160deg,#FFF8F0,#FFF0DC);
  border-top:1px solid rgba(200,134,10,.12); border-bottom:1px solid rgba(200,134,10,.12);
}
.q-mark { font-size:64px; color:var(--gold-l); opacity:.3; font-family:Georgia,serif; line-height:.6; margin-bottom:10px; display:block; }
.q-body { font-size:20px; color:var(--brown); font-weight:500; line-height:1.75; }

/* ── 数字统计 ── */
#stats { text-align:center; background:var(--cream); }
.stats-row { display:flex; justify-content:center; gap:0; margin-top:8px; }
.stat-item {
  flex:1; max-width:120px;
  padding:20px 8px;
  position:relative;
}
.stat-item + .stat-item::before {
  content:''; position:absolute; left:0; top:30%; height:40%;
  width:1px; background:rgba(200,134,10,.2);
}
.stat-num  { font-size:36px; font-weight:800; color:var(--brown); line-height:1; display:block; }
.stat-unit { font-size:12px; color:var(--gold); letter-spacing:2px; margin-top:4px; display:block; }

/* ── 关键词 ── */
#keywords { text-align:center; }
.kw-wrap  { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.kw-tag   {
  padding:8px 20px;
  border:1.5px solid rgba(200,134,10,.45); border-radius:50px;
  font-size:15px; color:var(--brown-m);
  background:rgba(240,180,41,.07);
  opacity:0; transform:scale(.85);
  transition:opacity .4s ease, transform .4s ease;
}
.kw-tag.vis { opacity:1; transform:scale(1); }

/* ── 分隔 ── */
.divider { display:flex; align-items:center; gap:12px; padding:0 28px; opacity:.3; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--amber); }

/* ── 信件 ── */
#letter { background:linear-gradient(160deg,#FFFAF5,#FFF5E8); border-top:1px solid rgba(200,134,10,.1); border-bottom:1px solid rgba(200,134,10,.1); }
.letter-body { background:white; border-radius:var(--radius); padding:28px 22px; box-shadow:0 4px 24px var(--shadow); }
.letter-p    { font-size:15.5px; color:var(--text); line-height:2.05; text-indent:2em; margin-bottom:20px; }
.letter-p:last-child { margin-bottom:0; }

/* ── 签名 ── */
#signature { padding:28px 28px 48px; text-align:right; }
.sig-child { font-size:20px; color:var(--brown); font-weight:700; letter-spacing:2px; }
.sig-date  { font-size:13px; color:var(--muted); margin-top:6px; }

/* ── 照片相册（premium）── */
#photos { padding:56px 0; }
.photo-scroll {
  display:flex; gap:14px;
  overflow-x:auto; padding:4px 28px 16px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory;
}
.photo-scroll::-webkit-scrollbar { display:none; }
.photo-card { flex-shrink:0; width:220px; border-radius:14px; overflow:hidden; box-shadow:0 6px 24px var(--shadow); scroll-snap-align:start; }
.photo-card img   { width:100%; height:165px; object-fit:cover; display:block; }
.photo-caption    { font-size:12px; color:var(--muted); text-align:center; padding:8px 0 6px; background:white; letter-spacing:1px; }

/* ── 时间轴（premium）── */
#timeline { padding:56px 28px; }
.tl-wrap  { position:relative; padding-left:28px; margin-top:8px; }
.tl-wrap::before { content:''; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:linear-gradient(180deg,var(--gold-l),var(--amber)); border-radius:2px; }
.tl-item  { position:relative; margin-bottom:28px; }
.tl-item:last-child { margin-bottom:0; }
.tl-dot   { position:absolute; left:-24px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px rgba(200,134,10,.2); }
.tl-year  { font-size:12px; color:var(--gold); letter-spacing:2px; margin-bottom:4px; }
.tl-text  { font-size:15px; color:var(--text); line-height:1.7; }

/* ── 修复对比（premium）── */
#restoration { text-align:center; }
.restore-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
.restore-card { border-radius:14px; overflow:hidden; box-shadow:0 4px 18px var(--shadow); }
.restore-card img { width:100%; height:180px; object-fit:cover; display:block; }
.restore-lbl  { font-size:11px; color:var(--muted); letter-spacing:2px; padding:9px 0; background:white; text-align:center; }

/* ── 录音（premium）── */
#audio-sec { text-align:center; }
.audio-card  { background:linear-gradient(135deg,#FFF3E0,#FFE5B4); border-radius:20px; padding:32px 24px; box-shadow:0 4px 24px var(--shadow); }
.audio-hint  { font-size:14px; color:var(--muted); margin-bottom:24px; }
.play-btn    { width:64px; height:64px; border-radius:50%; background:var(--gold); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; box-shadow:0 4px 20px rgba(200,134,10,.45); transition:transform .15s; }
.play-btn:active { transform:scale(.93); }
.play-btn svg    { width:26px; height:26px; fill:white; }
.prog-wrap   { height:4px; background:rgba(200,134,10,.2); border-radius:2px; overflow:hidden; }
.prog-fill   { height:100%; background:var(--gold); border-radius:2px; width:0%; transition:width .1s linear; }

/* ── 发给爸爸 ── */
#send-msg { text-align:center; }
.send-card  { background:white; border:1.5px solid rgba(200,134,10,.2); border-radius:20px; padding:32px 24px; box-shadow:0 4px 20px var(--shadow); }
.send-hint  { font-size:11px; letter-spacing:3px; color:var(--gold); margin-bottom:16px; }
.send-text  { font-size:18px; color:var(--brown); line-height:1.8; margin-bottom:28px; font-weight:500; }
.copy-btn   { display:inline-flex; align-items:center; gap:8px; padding:15px 36px; background:var(--gold); color:white; border:none; border-radius:50px; font-size:16px; font-family:inherit; cursor:pointer; box-shadow:0 4px 18px rgba(200,134,10,.4); transition:all .2s; letter-spacing:1px; }
.copy-btn:active  { transform:scale(.96); }
.copy-btn.ok { background:#2D9C5A; box-shadow:0 4px 18px rgba(45,156,90,.4); }

/* ── 结尾仪式感卡片 ── */
#closing {
  margin:0 28px 60px;
  background:linear-gradient(135deg,#4A2C0A,#7A4A1E);
  border-radius:24px;
  padding:40px 28px;
  text-align:center;
  box-shadow:0 8px 32px rgba(74,44,10,.35);
  opacity:0; transform:translateY(28px);
  transition:opacity .75s ease, transform .75s ease;
}
#closing.vis { opacity:1; transform:translateY(0); }
.closing-flower { font-size:32px; margin-bottom:16px; }
.closing-line1  { font-size:22px; color:#FFE0A0; font-weight:700; letter-spacing:4px; margin-bottom:10px; }
.closing-line2  { font-size:14px; color:rgba(255,224,160,.65); letter-spacing:2px; }

/* ── 尾部 ── */
#footer { text-align:center; padding:0 28px 90px; font-size:12px; color:var(--muted); opacity:.45; }

/* ── 背景音乐 FAB ── */
#music-fab {
  position:fixed; bottom:28px; right:18px; width:50px; height:50px;
  border-radius:50%; background:var(--gold); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 18px rgba(200,134,10,.45); z-index:999;
}
#music-fab.spin { animation:mSpin 3s linear infinite; }
#music-fab svg  { width:22px; height:22px; fill:white; }
@keyframes mSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* ── 动效 ── */
@keyframes fadeUp { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }

/* premium-only 默认隐藏 */
.premium-only { display:none; }
</style>
</head>
<body>

<div id="petals"></div>

<div id="app">

  <!-- ① 封面 -->
  <section id="cover">
    <p class="cv-badge">父 亲 节 礼 物</p>
    <h1 class="cv-name" id="coverName">爸爸</h1>
    <p class="cv-sub">这份礼物，专属于你</p>
    <div class="cv-flower">🌸</div>
    <p class="cv-date" id="coverDate"></p>
    <div class="cv-arrow"><div class="arrow-v"></div><span>向下翻</span></div>
  </section>

  <!-- ② 引言 -->
  <section id="quote" class="section">
    <p class="sec-label">写 给 你 的 话</p>
    <span class="q-mark">"</span>
    <p class="q-body" id="quoteText"></p>
  </section>

  <!-- ③ 岁月数字 -->
  <section id="stats" class="section">
    <p class="sec-label">我们的时光</p>
    <div class="stats-row">
      <div class="stat-item"><span class="stat-num" id="yearsNum">--</span><span class="stat-unit">年</span></div>
      <div class="stat-item"><span class="stat-num" id="daysNum">--</span><span class="stat-unit">个日夜</span></div>
      <div class="stat-item"><span class="stat-num">♾</span><span class="stat-unit">的爱</span></div>
    </div>
  </section>

  <!-- ④ 关键词 -->
  <section id="keywords" class="section">
    <p class="sec-label">我 眼 中 的 你</p>
    <div class="kw-wrap" id="kwWrap"></div>
  </section>

  <div class="divider">🌼</div>

  <!-- ⑤ 信件 -->
  <section id="letter" class="section">
    <p class="sec-label">我 想 对 你 说</p>
    <div class="letter-body" id="letterBody"></div>
  </section>

  <!-- ⑥ 签名 -->
  <div id="signature" class="section">
    <p class="sig-child" id="sigChild"></p>
    <p class="sig-date"  id="sigDate"></p>
  </div>

  <!-- ⑦ 照片相册（premium）-->
  <section id="photos" class="section premium-only">
    <p class="sec-label" style="padding:0 28px">我 们 的 记 忆</p>
    <div class="photo-scroll" id="photoScroll"></div>
  </section>

  <!-- ⑧ 时间轴（premium）-->
  <section id="timeline" class="section premium-only">
    <p class="sec-label">时 光 轴</p>
    <div class="tl-wrap" id="tlWrap"></div>
  </section>

  <div class="divider premium-only">🌺</div>

  <!-- ⑨ 旧照修复（premium）-->
  <section id="restoration" class="section premium-only">
    <p class="sec-label">时 光 修 复</p>
    <p style="font-size:14px;color:var(--muted);text-align:center;margin-bottom:4px">把老照片还原成新的样子</p>
    <div class="restore-grid">
      <div class="restore-card">
        <img id="restoreBefore" src="" alt="修复前">
        <p class="restore-lbl">从 前</p>
      </div>
      <div class="restore-card">
        <img id="restoreAfter" src="" alt="修复后">
        <p class="restore-lbl">修 复 后</p>
      </div>
    </div>
  </section>

  <!-- ⑩ 录音（premium，有 audioUrl 才显示）-->
  <section id="audio-sec" class="section premium-only">
    <p class="sec-label">亲 口 说 的 话</p>
    <div class="audio-card">
      <p class="audio-hint">点击播放，听我亲口说给你听</p>
      <button class="play-btn" id="playBtn" onclick="toggleAudio()">
        <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
      <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
    </div>
  </section>

  <!-- ⑪ 发给爸爸 -->
  <section id="send-msg" class="section">
    <p class="sec-label">发 给 爸 爸</p>
    <div class="send-card">
      <p class="send-hint">长按复制 · 发给他</p>
      <p class="send-text" id="sendText"></p>
      <button class="copy-btn" id="copyBtn" onclick="copyMsg()">
        <span>📋</span><span id="copyLabel">复制这句话</span>
      </button>
    </div>
  </section>

  <!-- ⑫ 结尾卡片 -->
  <div id="closing">
    <div class="closing-flower">🌸</div>
    <p class="closing-line1" id="closingLine1">爸，节日快乐</p>
    <p class="closing-line2" id="closingLine2">你永远是我最重要的人</p>
  </div>

  <p id="footer">用心做的，送给最重要的人</p>
</div>

<!-- 背景音乐 FAB -->
<button id="music-fab" onclick="toggleMusic()" style="display:none" title="背景音乐">
  <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
</button>

<audio id="bgAudio" loop></audio>
<audio id="voiceAudio"></audio>

<script>
(function init() {
  const C = CONFIG;
  const now = new Date().getFullYear();

  // 基础文字
  document.getElementById('coverName').textContent  = C.fatherName;
  document.getElementById('coverDate').textContent  = C.date + ' · 父亲节';
  document.getElementById('quoteText').textContent  = C.openingQuote;
  document.getElementById('sendText').textContent   = C.sendMessage;
  document.getElementById('sigChild').textContent   = C.childName + ' 敬上';
  document.getElementById('sigDate').textContent    = C.date;
  document.getElementById('closingLine1').textContent = C.fatherName + '，节日快乐';

  // 数字统计
  const years = now - C.childBirthYear;
  const days  = Math.round(years * 365.25);
  countUp('yearsNum', years, 1200);
  countUp('daysNum',  days,  1800);

  // 关键词
  const kw = document.getElementById('kwWrap');
  C.keywords.forEach((w, i) => {
    const t = document.createElement('span');
    t.className = 'kw-tag';
    t.textContent = w;
    t.style.transitionDelay = (i * 0.1) + 's';
    kw.appendChild(t);
  });

  // 信件段落
  const lb = document.getElementById('letterBody');
  ['p1','p2','p3','p4'].forEach(k => {
    if (!C.letter[k]) return;
    const p = document.createElement('p');
    p.className = 'letter-p';
    p.textContent = C.letter[k];
    lb.appendChild(p);
  });

  // premium 专属内容
  if (C.plan === 'premium') {
    document.querySelectorAll('.premium-only').forEach(el => el.classList.remove('premium-only'));

    // 照片
    const ps = document.getElementById('photoScroll');
    (C.photos || []).forEach(item => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      const img = document.createElement('img');
      img.src = item.url || item; img.alt = '家庭照片'; img.loading = 'lazy';
      card.appendChild(img);
      if (item.caption) {
        const cap = document.createElement('p');
        cap.className = 'photo-caption';
        cap.textContent = item.caption;
        card.appendChild(cap);
      }
      ps.appendChild(card);
    });

    // 时间轴
    const tl = document.getElementById('tlWrap');
    (C.timeline || []).forEach(item => {
      const div = document.createElement('div');
      div.className = 'tl-item';
      div.innerHTML = `<div class="tl-dot"></div><p class="tl-year">${item.year}</p><p class="tl-text">${item.text}</p>`;
      tl.appendChild(div);
    });

    // 修复对比
    if (C.restorationBefore) document.getElementById('restoreBefore').src = C.restorationBefore;
    if (C.restorationAfter)  document.getElementById('restoreAfter').src  = C.restorationAfter;

    // 录音
    if (C.audioUrl) {
      document.getElementById('voiceAudio').src = C.audioUrl;
    } else {
      document.getElementById('audio-sec').style.display = 'none';
    }

    // 背景音乐
    if (C.bgMusicUrl) {
      document.getElementById('bgAudio').src = C.bgMusicUrl;
      document.getElementById('music-fab').style.display = 'flex';
    }
  }

  spawnPetals();
  observeSections();
})();

/* 数字滚动 */
function countUp(id, target, duration) {
  const el = document.getElementById(id);
  const start = performance.now();
  function frame(now) {
    const p = Math.min((now - start) / duration, 1);
    el.textContent = Math.floor(p * target);
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = target;
  }
  requestAnimationFrame(frame);
}

/* 花瓣 */
function spawnPetals() {
  const emojis = ['🌸','🌺','🌼','✿','❀'];
  const c = document.getElementById('petals');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.textContent = emojis[i % emojis.length];
    p.style.left             = Math.random() * 100 + 'vw';
    p.style.fontSize         = (13 + Math.random() * 13) + 'px';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    p.style.animationDelay   = (Math.random() * 12) + 's';
    c.appendChild(p);
  }
}

/* 滚动入场 */
function observeSections() {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('vis');
      e.target.querySelectorAll('.kw-tag').forEach((t, i) =>
        setTimeout(() => t.classList.add('vis'), i * 80)
      );
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.section, #closing').forEach(el => io.observe(el));
}

/* 复制 */
function copyMsg() {
  const text = CONFIG.sendMessage;
  const btn  = document.getElementById('copyBtn');
  const lbl  = document.getElementById('copyLabel');
  const done = () => {
    btn.classList.add('ok'); lbl.textContent = '已复制 ✓';
    setTimeout(() => { btn.classList.remove('ok'); lbl.textContent = '复制这句话'; }, 2500);
  };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(done).catch(fallback) : fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done();
  }
}

/* 录音 */
const voice = document.getElementById('voiceAudio');
let voicePlaying = false;
voice.ontimeupdate = () => {
  if (!voice.duration) return;
  document.getElementById('progFill').style.width = (voice.currentTime / voice.duration * 100) + '%';
};
voice.onended = () => {
  voicePlaying = false;
  document.getElementById('playIcon').innerHTML = '<polygon points="5,3 19,12 5,21"/>';
  document.getElementById('progFill').style.width = '0%';
};
function toggleAudio() {
  if (!CONFIG.audioUrl) { alert('暂无录音文件'); return; }
  if (voicePlaying) {
    voice.pause(); voicePlaying = false;
    document.getElementById('playIcon').innerHTML = '<polygon points="5,3 19,12 5,21"/>';
  } else {
    voice.play(); voicePlaying = true;
    document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  }
}

/* 背景音乐 */
const bgAudio = document.getElementById('bgAudio');
const fab = document.getElementById('music-fab');
let bgPlaying = false;
function toggleMusic() {
  if (bgPlaying) { bgAudio.pause(); bgPlaying = false; fab.classList.remove('spin'); }
  else bgAudio.play().then(() => { bgPlaying = true; fab.classList.add('spin'); }).catch(()=>{});
}
</script>
